# 宽基ETF量价跟踪器 · nginx 站点配置
# 部署位置: /etc/nginx/sites-available/etf-watch
# 启用:     ln -sf /etc/nginx/sites-available/etf-watch /etc/nginx/sites-enabled/
#
# 设计要点:
#   1. 监听 8080 而非 80 —— 避开国内 ICP 备案要求(IP + 非标端口无需备案)
#   2. basic auth 全站保护 —— 内容是行情推算,不公开传播
#   3. noindex —— 双保险,即使被转发也不进搜索引擎
#   4. 只允许 GET/HEAD —— 纯静态站不需要别的动词

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /opt/etf-watch;
    index index.html;

    # 访问口令(用户名 etf,口令由 htpasswd 生成)
    auth_basic           "ETF Watcher";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 不允许任何写操作
    limit_except GET HEAD {
        deny all;
    }

    # 爬虫禁入
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 页面主体:允许短缓存,但每次都校验
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 快照:绝不缓存。页面已经带 ?t= 时间戳,这里再兜一层
    location = /data/snapshot.js {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Robots-Tag "noindex" always;
    }

    location /data/ {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # 不暴露部署脚本、日志和笔记
    location ~ ^/(deploy|logs)/ {
        return 404;
    }
    location ~ \.(sh|py|bat|cron|md)$ {
        return 404;
    }
    # snapshot.json 与 snapshot.js 同源内容,不必要地多一个入口
    location = /data/snapshot.json {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json text/plain;

    access_log /var/log/nginx/etf-watch.access.log;
    error_log  /var/log/nginx/etf-watch.error.log warn;
}
